site_name: doormat
site_description: Find passwords and secrets hidden in spreadsheets with spatial analysis and a fast Rust core
site_url: https://dipan010.github.io/doormat/
repo_url: https://github.com/dipan010/doormat
repo_name: dipan010/doormat
edit_uri: edit/main/docs/
copyright: MIT OR Apache-2.0

theme:
  name: material
  # Zensical's classic variant keeps the Material for MkDocs look.
  variant: classic
  features:
    - content.code.copy
    - navigation.sections
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Switch to light mode }

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - API reference: api.md
  - File formats: formats.md
  - How detection works: how-it-works.md
  - Threat model: threat-model.md
  - Evaluation: evaluation.md
  - Design decisions:
      - decisions/index.md
      - decisions/0001-remove-arrow2.md
      - decisions/0002-deduplicate-per-cell.md
      - decisions/0003-held-out-test-split.md
      - decisions/0004-present-cells-only.md
      - decisions/0005-zip-bomb-limits.md
      - decisions/0006-abi3-python-310.md
      - decisions/0007-cells-only-xlsx-reader.md
      - decisions/0008-per-sheet-errors.md
      - decisions/0009-pre-registered-evaluation.md
      - decisions/0010-cell-limit.md
      - decisions/0011-compound-labels.md
      - decisions/0012-zensical.md
      - decisions/0013-forged-zip-sizes.md
  - Security policy: security.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

validation:
  links:
    absolute_links: info
    unrecognized_links: warn
