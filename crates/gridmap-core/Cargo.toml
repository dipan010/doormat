[package]
name = "gridmap-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Spatial document graph engine for credential detection in spreadsheets"
authors = ["Dipan Ghosh"]
keywords = ["dlp", "credentials", "security", "spreadsheet"]
categories = ["text-processing", "parser-implementations"]
repository = "https://github.com/dipan010/gridmap"
readme = "../../README.md"

[dependencies]
ahash = "0.8"
aho-corasick = "1.1"
arrow2 = { version = "0.18", default-features = false }
rayon = "1.10"
regex = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "phases"
harness = false

[[bench]]
name = "subphases"
harness = false
