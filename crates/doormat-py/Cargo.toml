[package]
name = "doormat-py"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "PyO3 bindings for the doormat spreadsheet credential detection engine"
authors = ["Dipan Ghosh"]
keywords = ["dlp", "credentials", "security", "pyo3"]
categories = ["api-bindings"]
repository = "https://github.com/dipan010/doormat"
readme = "../../README.md"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
doormat-core = { path = "../doormat-core", version = "0.2.0" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
