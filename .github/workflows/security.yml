name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new advisories against unchanged dependencies are caught.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-dependencies:
    name: Rust dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # RustSec advisories (what cargo-audit checks), licences, bans and sources,
      # configured in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  python-dependencies:
    name: Python dependencies (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Audit runtime and optional dependencies declared in pyproject.toml
        run: |
          python -m pip install --upgrade pip pip-audit
          python - > requirements-audit.txt <<'PY'
          import tomllib
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          deps = set(project["dependencies"])
          for extra in project.get("optional-dependencies", {}).values():
              deps.update(extra)
          print("\n".join(sorted(deps)))
          PY
          pip-audit --requirement requirements-audit.txt

  static-analysis:
    name: Static analysis (bandit, semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install scanners
        run: python -m pip install --upgrade pip bandit semgrep
      - name: Bandit
        run: bandit -q -r python/doormat bench
      - name: Semgrep
        run: >-
          semgrep scan --error --metrics=off
          --config p/security-audit --config p/python --config p/rust --config p/secrets
          --exclude target --exclude .venv
