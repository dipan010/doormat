name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The harness prints non-ASCII status marks; Windows consoles default to cp1252.
  PYTHONUTF8: "1"

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch; toolchain set by input
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Core tests
        # doormat-py is a Python extension module and has no Rust tests of its own.
        run: cargo test -p doormat-core

  typing:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install mypy and third-party stubs
        run: python -m pip install --upgrade pip mypy types-openpyxl
      - name: mypy
        run: mypy

  docs:
    name: Docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install docs toolchain
        run: python -m pip install --upgrade pip -r docs/requirements.txt
      - name: zensical build --strict
        run: zensical build --strict --clean

  coverage:
    name: Coverage (Rust and Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch; toolchain set by input
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov
      - name: Rust coverage (doormat-core unit tests; floor 95% of lines)
        run: cargo llvm-cov -p doormat-core --summary-only --fail-under-lines 95 | tee rust-coverage.txt
      - name: Python coverage (installed package; floor 90%)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[all]" pytest pytest-cov xlwt
          python bench/fixtures/generate_fixtures.py
          python -m pytest python/tests -q --cov=doormat --cov-report=term --cov-fail-under=90 | tee python-coverage.txt
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Coverage"
            echo
            echo "| Component | Lines |"
            echo "|---|---|"
            echo "| Rust (doormat-core) | $(grep '^TOTAL' rust-coverage.txt | awk '{print $10}') |"
            echo "| Python (doormat) | $(grep '^TOTAL' python-coverage.txt | awk '{print $NF}') |"
          } >> "$GITHUB_STEP_SUMMARY"

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch; toolchain set by input
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build and install doormat with all extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[all]" pytest xlwt
      - name: Generate fixtures
        run: python bench/fixtures/generate_fixtures.py
      - name: Tests
        run: python -m pytest python/tests -q
      - name: Precision/recall harness
        run: python bench/harness/run_harness.py
