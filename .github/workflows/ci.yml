name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The harness prints non-ASCII status marks; Windows consoles default to cp1252.
  PYTHONUTF8: "1"

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Core tests
        # doormat-py is a Python extension module and has no Rust tests of its own.
        run: cargo test -p doormat-core

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and install doormat with all extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[all]" pytest
      - name: Generate fixtures
        run: python bench/fixtures/generate_fixtures.py
      - name: Tests
        run: python -m pytest python/tests -q
      - name: Precision/recall harness
        run: python bench/harness/run_harness.py
