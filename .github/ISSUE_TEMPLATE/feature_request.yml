name: Feature request
description: Suggest a new capability or an API improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work. An example of the API you would call is ideal.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
