[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "doormat"
description = "Spatial document graph engine for credential detection in spreadsheets"
requires-python = ">=3.9"
dependencies = ["openpyxl"]
dynamic = ["version"]
license = "MIT OR Apache-2.0"
readme = "README.md"
authors = [
    {name = "Dipan Ghosh"},
]
keywords = ["dlp", "credentials", "security", "xlsx", "spreadsheet", "spatial-inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Office/Business :: Office Suites",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
]

[project.optional-dependencies]
xls = ["xlrd>=2.0"]
ods = ["odfpy>=1.4"]
all = ["xlrd>=2.0", "odfpy>=1.4"]

[project.urls]
Homepage = "https://github.com/dipan010/doormat"
Repository = "https://github.com/dipan010/doormat"
Issues = "https://github.com/dipan010/doormat/issues"
Changelog = "https://github.com/dipan010/doormat/blob/main/CHANGELOG.md"

[tool.maturin]
manifest-path = "crates/doormat-py/Cargo.toml"
python-source = "python"
module-name = "doormat._core"
features = ["pyo3/extension-module"]
