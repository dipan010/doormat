[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "doormat"
description = "Find passwords and secrets hidden in spreadsheets (xlsx, xls, ods, csv) with spatial analysis and a fast Rust core"
requires-python = ">=3.10"
dependencies = ["openpyxl"]
dynamic = ["version"]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
readme = "README.md"
authors = [
    {name = "Dipan Ghosh"},
]
keywords = [
    "secrets", "secret-detection", "credentials", "password", "security", "dlp",
    "spreadsheet", "excel", "xlsx", "ods", "csv", "rust",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Quality Assurance",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.optional-dependencies]
xls = ["xlrd>=2.0"]
ods = ["odfpy>=1.4"]
all = ["xlrd>=2.0", "odfpy>=1.4"]

[project.urls]
Homepage = "https://github.com/dipan010/doormat"
Documentation = "https://github.com/dipan010/doormat#readme"
Repository = "https://github.com/dipan010/doormat"
Issues = "https://github.com/dipan010/doormat/issues"
Changelog = "https://github.com/dipan010/doormat/blob/main/CHANGELOG.md"

[tool.maturin]
manifest-path = "crates/doormat-py/Cargo.toml"
python-source = "python"
module-name = "doormat._core"
features = ["pyo3/extension-module"]
